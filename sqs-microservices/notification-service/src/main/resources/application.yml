spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018/notificationdb?replicaSet=rs0&directConnection=true}

  cloud:
    aws:
      credentials:
        access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:test}
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:test}
      region:
        static: ${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}
      sqs:
        endpoint: ${SPRING_CLOUD_AWS_SQS_ENDPOINT:http://localhost:4566}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    # Sem default — se a env var não vier, o startup falha rápido com
    # mensagem clara (em vez de autenticar com string vazia e dar erro confuso).
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    # Gmail exige autenticação e STARTTLS na porta 587.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Configuração específica do envio de e-mail desta aplicação.
# Ambos vêm do .env via docker-compose; sem default pra forçar configuração explícita.
notification:
  mail:
    from: ${NOTIFICATION_MAIL_FROM}
    to: ${NOTIFICATION_MAIL_TO}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers, retries
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Configuracao Resilience4j pro envio de email via SMTP.
# Nome 'smtp' bate com @CircuitBreaker(name="smtp") + @Retry(name="smtp") no EmailService.
resilience4j:
  circuitbreaker:
    instances:
      smtp:
        # Janela deslizante baseada em CONTAGEM de chamadas (count-based) — mais
        # previsivel que time-based em servico com volume baixo/medio.
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        # CB so comeca a decidir depois de ter dados suficientes — evita abrir
        # com 1 erro em 1 chamada (estatisticamente irrelevante).
        minimum-number-of-calls: 10
        # Se >=50% das ultimas 20 chamadas falharem, abre o circuito.
        failure-rate-threshold: 50
        # Chamada >5s conta como "lenta"; se >=50% sao lentas, abre.
        # Protege contra SMTP que responde mas com latencia degradada.
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 5s
        # Tempo OPEN antes de testar com chamadas em HALF_OPEN.
        wait-duration-in-open-state: 30s
        # Quantas chamadas de teste permitir em HALF_OPEN antes de decidir
        # voltar pra CLOSED ou OPEN de novo.
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Excecoes que CONTAM como falha (incrementam o failure rate).
        record-exceptions:
          - com.microservices.notification.exception.EmailDeliveryException
          - org.springframework.mail.MailException
          - jakarta.mail.MessagingException
  retry:
    instances:
      smtp:
        max-attempts: 3
        wait-duration: 200ms
        # Backoff exponencial: 200ms -> 400ms -> 800ms entre tentativas.
        # Evita martelar SMTP que ja tava lento.
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # So retentar em erro de SMTP real. CallNotPermittedException (CB OPEN)
        # NAO entra aqui — propaga direto, sem retry inutil que so gasta tempo.
        retry-exceptions:
          - com.microservices.notification.exception.EmailDeliveryException
          - org.springframework.mail.MailException
          - jakarta.mail.MessagingException

mongock:
  # Pacote raiz onde Mongock procura @ChangeUnit. Restringe o scan
  # para evitar varrer todo o classpath.
  migration-scan-package: com.microservices.notification.infrastructure.migration
  # InitializingBean: roda antes do Tomcat aceitar trafego. Garante que
  # nenhum request HTTP / listener SQS comece antes das migrations terminarem.
  runner-type: initializingbean
  # MongoDB nao suporta DDL (createIndexes, createCollection) dentro de
  # transacao multi-doc. Migrations transacionais habilitam por ChangeUnit
  # via @ChangeUnit(transactional=true) e devem ser DML pura.
  transactional: false
  enabled: true
