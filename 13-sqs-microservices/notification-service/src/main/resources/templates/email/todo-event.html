<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="|Todo ${action}|">Todo</title>
</head>
<body style="margin:0;padding:0;font-family:Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:#f4f4f7;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f7;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="560" cellpadding="0" cellspacing="0"
                   style="background:#ffffff;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden;">

                <tr>
                    <td th:style="|padding:24px 32px;background:${headerColor};color:#ffffff;|"
                        style="padding:24px 32px;background:#0f172a;color:#ffffff;">
                        <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;">Notificação</div>
                        <div style="font-size:22px;font-weight:600;margin-top:4px;"
                             th:text="|Todo ${action}|">Todo CREATED</div>
                    </td>
                </tr>

                <tr>
                    <td style="padding:24px 32px;color:#0f172a;">
                        <h2 style="margin:0 0 16px;font-size:18px;font-weight:600;"
                            th:text="${title}">Título do todo</h2>

                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                               style="font-size:14px;color:#475569;">
                            <tr>
                                <td style="padding:6px 0;width:120px;color:#94a3b8;">ID</td>
                                <td style="padding:6px 0;font-family:Consolas,monospace;"
                                    th:text="${todoId}">abc-123</td>
                            </tr>
                            <tr>
                                <td style="padding:6px 0;color:#94a3b8;">Ação</td>
                                <td style="padding:6px 0;" th:text="${action}">CREATED</td>
                            </tr>
                            <tr>
                                <td style="padding:6px 0;color:#94a3b8;">Ocorrido em</td>
                                <td style="padding:6px 0;" th:text="${occurredAt}">21/05/2026 19:08:29</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <tr>
                    <td style="padding:16px 32px;background:#f8fafc;color:#94a3b8;font-size:12px;text-align:center;">
                        Enviado automaticamente pelo notification-service
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
