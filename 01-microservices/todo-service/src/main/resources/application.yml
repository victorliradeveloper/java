spring:
  application:
    name: todo-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tododb}
    username: ${SPRING_DATASOURCE_USERNAME:todo_user}
    password: ${SPRING_DATASOURCE_PASSWORD:todo_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

idempotency:
  key-ttl: PT24H              # janela em que uma key cacheada continua valida (padrao Stripe: 24h)
  max-key-length: 255         # limite defensivo pra evitar abuso
  cleanup-interval: PT1H      # frequencia do job de limpeza de claims expirados
  cleanup-initial-delay: PT5M # atraso inicial pra nao competir com startup

outbox:
  poll-interval-ms: 2000      # intervalo entre ciclos do @Scheduled do publisher
  batch-size: 50              # max eventos por ciclo (protege a TX de crescer demais)
  lease-duration-ms: 30000    # TTL do lease quando um worker reivindica um evento
  backoff:
    initial-ms: 2000          # primeiro retry depois de ~2s (com +/-25% de jitter)
    max-ms: 60000             # cap em 60s — sequencia: 2s, 4s, 8s, 16s, 32s, 60s, 60s, ...
