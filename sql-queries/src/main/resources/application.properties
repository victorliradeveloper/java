server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5433/sql-queries
spring.datasource.username=postgres
spring.datasource.password=postgres123

# create: drops and recreates all tables on startup — perfect for a study project
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# keeps the EntityManager open during the full HTTP request so lazy collections can be serialized
spring.jpa.open-in-view=true
