spring:
  application:
    name: todo-service
  data:
    mongodb:
      # Default usado em dev local (sem docker). Em compose, vem de
      # SPRING_DATA_MONGODB_URI apontando pra mongo:27017.
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018/tododb?replicaSet=rs0&directConnection=true}

  cloud:
    aws:
      credentials:
        access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:test}
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:test}
      region:
        static: ${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}
      # todo-service publica no SNS (publisher) — nao consome SQS.
      # Endpoint aponta pro LocalStack em dev; em prod real os endpoints
      # da AWS sao detectados automaticamente pela regiao.
      sns:
        endpoint: ${SPRING_CLOUD_AWS_SNS_ENDPOINT:http://localhost:4566}

server:
  port: 8081

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

outbox:
  # Intervalo entre ciclos de polling do OutboxPublisher (ms).
  poll-interval-ms: 2000
  # Maximo de eventos processados por ciclo de polling.
  batch-size: 50
  # Tempo de vida do lease quando um worker reivindica um evento (ms).
  # Se o worker crashar antes de marcar publishedAt, o lease expira e outro
  # worker pode pegar o evento. Mantenha > tempo maximo plausivel de publish.
  lease-duration-ms: 30000
  # Backoff exponencial entre tentativas de publish quando o SNS/SQS falha.
  # Evita martelar dependencia degradada e dispersa retentativas no tempo
  # (jitter de +/-25% aplicado em OutboxEvent.markFailed).
  # Sequencia tipica com os defaults: 2s, 4s, 8s, 16s, 32s, 60s (cap), 60s, ...
  backoff:
    initial-ms: 2000
    max-ms: 60000

idempotency:
  # TTL das chaves de idempotencia na collection idempotency_keys. Aceita
  # sintaxe Duration do Spring (24h, 90m, 7d). Padrao Stripe = 24h.
  # Apos esse tempo, o Mongo apaga o doc automaticamente (TTL index criado
  # pela V004_IdempotencyKeyIndexes).
  key-ttl: 24h
  # Tamanho maximo aceito pra header Idempotency-Key (Stripe padrao = 255).
  max-key-length: 255

mongock:
  # Pacote raiz onde Mongock procura @ChangeUnit. Restringe o scan
  # para evitar varrer todo o classpath.
  migration-scan-package: com.microservices.todo.infrastructure.migration
  # InitializingBean roda na fase de inicializacao dos beans, antes do
  # Tomcat aceitar trafego. ApplicationRunner (default) roda DEPOIS do
  # "Started" log e do Tomcat aceitar requests - inaceitavel em prod, onde
  # o cliente nao pode pegar a app antes das migrations terminarem.
  runner-type: initializingbean
  # Transacao desligada: MongoDB nao permite createIndexes/createCollection
  # dentro de transacao multi-doc (erro 72 - InvalidOptions). Migracoes de
  # dados que precisem de atomicidade devem usar @ChangeUnit(transactional=true)
  # individualmente, e nunca misturar DDL com data nessas ChangeUnits.
  transactional: false
  enabled: true
