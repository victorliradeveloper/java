spring:
  application:
    name: notification-service

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27018/notificationdb?replicaSet=rs0&directConnection=true}

  cloud:
    aws:
      credentials:
        access-key: ${SPRING_CLOUD_AWS_CREDENTIALS_ACCESS_KEY:test}
        secret-key: ${SPRING_CLOUD_AWS_CREDENTIALS_SECRET_KEY:test}
      region:
        static: ${SPRING_CLOUD_AWS_REGION_STATIC:us-east-1}
      sqs:
        endpoint: ${SPRING_CLOUD_AWS_SQS_ENDPOINT:http://localhost:4566}

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    # Sem default — se a env var não vier, o startup falha rápido com
    # mensagem clara (em vez de autenticar com string vazia e dar erro confuso).
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    # Gmail exige autenticação e STARTTLS na porta 587.
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

# Configuração específica do envio de e-mail desta aplicação.
# Ambos vêm do .env via docker-compose; sem default pra forçar configuração explícita.
notification:
  mail:
    from: ${NOTIFICATION_MAIL_FROM}
    to: ${NOTIFICATION_MAIL_TO}

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info

mongock:
  # Pacote raiz onde Mongock procura @ChangeUnit. Restringe o scan
  # para evitar varrer todo o classpath.
  migration-scan-package: com.microservices.notification.infrastructure.migration
  # InitializingBean: roda antes do Tomcat aceitar trafego. Garante que
  # nenhum request HTTP / listener SQS comece antes das migrations terminarem.
  runner-type: initializingbean
  # MongoDB nao suporta DDL (createIndexes, createCollection) dentro de
  # transacao multi-doc. Migrations transacionais habilitam por ChangeUnit
  # via @ChangeUnit(transactional=true) e devem ser DML pura.
  transactional: false
  enabled: true
