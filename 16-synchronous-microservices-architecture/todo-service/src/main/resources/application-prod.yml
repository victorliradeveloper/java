# PROD — postura defensiva. Sem fallbacks, Actuator restrito.

spring:
  datasource:
    # Sem default: se a env var faltar, o app falha no boot (fail-fast).
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  flyway:
    clean-disabled: true        # nunca permite reset do schema

management:
  endpoints:
    web:
      exposure:
        include: health, info   # /env, /beans vazariam config sensivel
  endpoint:
    health:
      show-details: never       # probes do k8s so precisam de UP/DOWN
