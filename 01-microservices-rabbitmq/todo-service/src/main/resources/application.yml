spring:
  application:
    name: todo-service

  # Profile default. Env var SPRING_PROFILES_ACTIVE sobrescreve.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate    # schema eh gerenciado por Flyway, Hibernate so valida

  flyway:
    enabled: true
    # Trata V001 como baseline ja aplicada (DB ja tinha tabelas pre-existentes).
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "Initial schema baseline"

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: 8081

management:
  tracing:
    # W3C (traceparent) em vez do B3 default do Brave: padrao moderno e o formato
    # que persistimos no outbox (coluna trace_parent) pra costurar o trace atraves
    # da publicacao assincrona. Consumers devem usar o mesmo type pra dar join.
    propagation:
      type: w3c
    sampling:
      # 1.0 = todo request gera trace. Sem reporter o custo e' so' o traceId no MDC;
      # garante que toda linha de log tenha traceId, nao so' 10% (default).
      probability: 1.0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

# Config de negocio — nao varia entre dev e prod.
idempotency:
  key-ttl: PT24H              # janela em que uma key cacheada continua valida (padrao Stripe: 24h)
  max-key-length: 255
  cleanup-interval: PT1H      # frequencia da limpeza de claims expirados
  cleanup-initial-delay: PT5M

outbox:
  poll-interval-ms: 2000      # intervalo do @Scheduled do publisher
  batch-size: 50              # max eventos por ciclo
  lease-duration-ms: 30000    # TTL do lease de um worker
  backoff:
    initial-ms: 2000          # primeiro retry com +/-25% de jitter
    max-ms: 60000             # sequencia: 2s, 4s, 8s, 16s, 32s, 60s, ...
